<head>

  <title>風的形成｜海風原理互動教學</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --sky-top: #7ec8f5;
      --sky-bottom: #c8e8ff;
      --land: #5cb85c;
      --land-dark: #3d8b3d;
      --sea: #2e86c1;
      --sea-deep: #1a5f8f;
      --sun: #ffd54f;
      --sun-core: #ff9800;
      --hot: #e74c3c;
      --cold: #3498db;
      --ink: #1a3a4a;
      --panel: #ffffff;
      --accent: #f39c12;
      --ok: #27ae60;
      --hint: #e67e22;
      --shadow: 0 10px 28px rgba(26, 58, 74, 0.14);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 60% at 20% 0%, rgba(255, 213, 79, 0.35), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 10%, rgba(46, 134, 193, 0.28), transparent 50%),
        linear-gradient(165deg, #dff3ff 0%, #eaf8e8 45%, #d6eef8 100%);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 12px 36px;
    }

    .app-shell {
      width: min(980px, 100%);
    }

    .brand-title {
      font-size: clamp(1.55rem, 4vw, 2.15rem);
      font-weight: 900;
      letter-spacing: 0.03em;
      line-height: 1.2;
      background: linear-gradient(90deg, #e67e22, #2980b9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .panel {
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 3px solid #b8daf0;
    }

    .control-btn {
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .control-btn:hover {
      transform: translateY(-1px);
    }

    .control-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .control-btn.active {
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: #fff;
      box-shadow: 0 4px 12px rgba(230, 126, 34, 0.35);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: #fff;
      box-shadow: 0 4px 12px rgba(41, 128, 185, 0.35);
    }

    #sim-canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      cursor: pointer;
      background: linear-gradient(#7ec8f5, #c8e8ff);
      touch-action: manipulation;
    }

    .quiz-blank {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      vertical-align: middle;
      margin: 0.15rem 0.2rem;
    }

    .opt-btn {
      min-width: 4.6rem;
      background: #fff8e7;
      border: 2.5px solid #f0c36a;
      border-radius: 12px;
      padding: 0.35rem 0.75rem;
      font-weight: 800;
      font-size: 1rem;
      color: var(--ink);
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .opt-btn:hover {
      transform: translateY(-1px);
      border-color: #e67e22;
    }

    .opt-btn.selected {
      background: linear-gradient(135deg, #ffe082, #ffcc80);
      border-color: #e67e22;
      box-shadow: 0 3px 10px rgba(230, 126, 34, 0.28);
    }

    .opt-btn.correct {
      background: #e8f8ef;
      border-color: var(--ok);
      color: #1e8449;
    }

    .opt-btn.wrong {
      background: #fff0eb;
      border-color: #e74c3c;
      color: #c0392b;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes bounce-in {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }

    .feedback-ok {
      animation: bounce-in 0.45s ease;
      color: var(--ok);
    }

    .feedback-hint {
      animation: bounce-in 0.35s ease;
      color: var(--hint);
    }

    #confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -12px;
      width: 10px;
      height: 14px;
      border-radius: 2px;
      animation: confetti-fall linear forwards;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0.85; }
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;

      height: 26px;

    }

    input[type="range"]::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff59d, #ff9800);
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .tip-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #eaf6ff;
      border: 2px solid #a8d4f0;
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: #1f618d;
    }
  </style>
</head>
<body>
  <div class="app-shell space-y-4">
    <!-- 標題區：品牌級主題名稱 -->
    <header class="text-center pt-2 pb-1">
      <h1 class="brand-title mb-1">🌬️ 風的形成・海風原理</h1>

        <!-- 顯示模式 -->
        <div class="rounded-2xl bg-sky-50 border-2 border-sky-200 p-3 sm:p-4">

            <button type="button" id="mode-arrows" class="control-btn mode-btn rounded-xl px-3 py-2 text-sm font-bold bg-white text-sky-900 border-2 border-sky-300">

          <div class="mt-3 flex flex-wrap gap-3 text-sm font-semibold text-slate-600">
            <span><i class="legend-dot" style="background:#e74c3c;"></i> 熱空氣（上升）</span>
            <span><i class="legend-dot" style="background:#3498db;"></i> 冷空氣（海風）</span>

        </div>
      </div>
    </section>

    <!-- Canvas 動畫區 -->
    <section class="panel p-3 sm:p-4" aria-label="海風動畫模擬">
      <canvas id="sim-canvas" width="940" height="520" role="img" aria-label="日間海風形成動畫：左側陸地、右側海洋、中央氣流循環"></canvas>
      <p id="canvas-hint" class="text-center text-sm sm:text-base font-semibold text-slate-600 mt-2 mb-0">
        觀察：陸地受熱 → 熱空氣上升 → 海上冷空氣吹向陸地＝海風

    <!-- 互動問答 -->
    <section class="panel p-4 sm:p-5" aria-label="課本練習題">
      <h2 class="text-lg sm:text-xl font-black m-0 mb-3 text-slate-800">📝 課本練習：填一填，風怎麼形成？</h2>
      <div id="quiz-card" class="rounded-2xl bg-gradient-to-br from-yellow-50 to-orange-50 border-2 border-amber-200 p-4 sm:p-5">
        <div class="text-base sm:text-lg leading-relaxed font-semibold text-slate-800" id="quiz-sentence">
          <p class="m-0 mb-3">
            日間，在太陽的照射下，陸地上的空氣因受熱
            <span class="quiz-blank" role="group" aria-label="選項一：膨脹或收縮" data-q="q1">

            </span>
            而
            <span class="quiz-blank" role="group" aria-label="選項二：上升或下沉" data-q="q2">
              <button type="button" class="opt-btn" data-value="上升">上升</button>
              <button type="button" class="opt-btn" data-value="下沉">下沉</button>
            </span>
            。
          </p>
          <p class="m-0">
            海洋上較冷的空氣會流向陸地，補充了
            <span class="quiz-blank" role="group" aria-label="選項三：上升或下沉" data-q="q3">
              <button type="button" class="opt-btn" data-value="上升">上升</button>
              <button type="button" class="opt-btn" data-value="下沉">下沉</button>
            </span>
            的空氣。這樣，空氣流動便形成風。
          </p>
        </div>

        <div class="mt-4 flex flex-wrap items-center gap-3">
          <button type="button" id="check-answer" class="control-btn rounded-xl px-5 py-2.5 text-base font-black text-white bg-gradient-to-r from-emerald-500 to-teal-500 border-0 shadow-md">
            檢查答案 ✓
          </button>
          <button type="button" id="reset-quiz" class="control-btn rounded-xl px-4 py-2.5 text-sm font-bold bg-white text-slate-700 border-2 border-slate-300">
            再試一次
          </button>
        </div>
        <p id="quiz-feedback" class="mt-3 mb-0 text-base sm:text-lg font-bold min-h-[1.75rem]" role="status" aria-live="polite"></p>
      </div>
    </section>

    <footer class="text-center text-slate-500 text-sm font-semibold pb-2">
      自然科小實驗｜日間海風（Sea Breeze）互動教學
    </footer>
  </div>

  <div id="confetti-layer" aria-hidden="true"></div>

  <script>
    /**
     * ========================================
     * 風的形成（海風原理）互動教學
     * - WindSimulation：Canvas 粒子／箭頭氣流循環
     * - QuizGame：課本填空選擇題與慶祝特效
     * ========================================
     */

    // ---------- 工具函式 ----------
    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    // ---------- 氣流粒子 ----------
    class AirParticle {
      /**
       * @param {'hot'|'cold'} type 熱空氣 / 冷空氣
       * @param {object} layout 場景佈局比例
       */
      constructor(type, layout) {
        this.type = type;
        this.layout = layout;
        this.reset(true);
      }

      reset(randomPhase = false) {
        const L = this.layout;
        // 粒子在循環軌道上的進度 0~1
        this.t = randomPhase ? Math.random() : 0;
        this.baseSize = this.type === 'hot' ? rand(4, 8) : rand(3.5, 6.5);
        this.size = this.baseSize;
        this.wobble = rand(0, Math.PI * 2);
        this.speedJitter = rand(0.85, 1.15);
        this.alpha = rand(0.55, 0.9);
        this.expand = this.type === 'hot' ? 1 : 1;
      }

      /** 依進度算出在對流循環上的位置 */
      getPosition() {
        const L = this.layout;
        const landX = L.landCenterX;
        const seaX = L.seaCenterX;
        const groundY = L.groundY;
        const skyY = L.skyY;
        const midY = (groundY + skyY) / 2;

        // 熱空氣：陸地上升 → 高空飄向海洋 → 略下沉交接
        // 冷空氣：海洋下沉 → 貼近海面吹向陸地 → 在陸地交接上升
        let x, y;

        if (this.type === 'hot') {
          // 0~0.35 上升；0.35~0.7 高空往海；0.7~1 略降交接後重置
          if (this.t < 0.35) {
            const p = this.t / 0.35;
            x = landX + Math.sin(p * Math.PI) * L.w * 0.02;
            y = lerp(groundY - 8, skyY, p);
            this.expand = lerp(1, 1.85, p); // 受熱膨脹
          } else if (this.t < 0.7) {
            const p = (this.t - 0.35) / 0.35;
            x = lerp(landX, seaX, p);
            y = skyY + Math.sin(p * Math.PI) * 10;
            this.expand = lerp(1.85, 1.3, p);
          } else {
            const p = (this.t - 0.7) / 0.3;
            x = seaX + Math.sin(p * Math.PI) * L.w * 0.015;
            y = lerp(skyY, midY, p);
            this.expand = lerp(1.3, 1.05, p);
          }
        } else {
          // 冷空氣：0~0.3 海上下沉；0.3~0.75 水平吹向陸地；0.75~1 陸上交接
          if (this.t < 0.3) {
            const p = this.t / 0.3;
            x = seaX + Math.sin(p * Math.PI) * L.w * 0.02;
            y = lerp(midY - 20, groundY - 6, p);
            this.expand = 1;
          } else if (this.t < 0.75) {
            const p = (this.t - 0.3) / 0.45;
            x = lerp(seaX, landX, p);
            y = groundY - 6 + Math.sin(p * Math.PI * 2) * 4;
            this.expand = 1;
          } else {
            const p = (this.t - 0.75) / 0.25;
            x = landX;
            y = lerp(groundY - 6, groundY - 40, p);
            this.expand = 1;
          }
        }

        // 輕微左右晃動，增加生命感
        x += Math.sin(this.wobble) * 3;
        return { x, y };
      }

      update(dt, heat, boost) {
        // heat: 0~1；boost: 答對後風速加成（熱力差異刻意拉大，方便觀察）
        const flow = (0.05 + heat * 0.7) * this.speedJitter * boost;
        this.t += flow * dt;
        this.wobble += dt * 2.2;
        if (this.t >= 1) this.reset(false);
        this.size = this.baseSize * this.expand * (0.85 + heat * 0.35);
      }

      draw(ctx) {
        const { x, y } = this.getPosition();
        const isHot = this.type === 'hot';
        const r = this.size;

        ctx.save();
        ctx.globalAlpha = this.alpha;
        const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r * 1.4);
        if (isHot) {
          grad.addColorStop(0, '#ffe082');
          grad.addColorStop(0.45, '#ff7043');
          grad.addColorStop(1, 'rgba(231, 76, 60, 0)');
        } else {
          grad.addColorStop(0, '#e3f2fd');
          grad.addColorStop(0.45, '#42a5f5');
          grad.addColorStop(1, 'rgba(52, 152, 219, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r * 1.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ---------- 提示泡泡 ----------
    class TipBubble {
      constructor(x, y, text) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.life = 0;
        this.maxLife = 2.4;
      }

      update(dt) {
        this.life += dt;
        this.y -= 18 * dt;
      }

      get alive() {
        return this.life < this.maxLife;
      }

      draw(ctx) {
        const t = this.life / this.maxLife;
        const alpha = t < 0.15 ? t / 0.15 : 1 - (t - 0.15) / 0.85;
        ctx.save();
        ctx.globalAlpha = clamp(alpha, 0, 1);
        ctx.font = 'bold 15px "Noto Sans TC", sans-serif';
        const padX = 12;
        const padY = 8;
        const tw = ctx.measureText(this.text).width;
        const w = tw + padX * 2;
        const h = 28;
        const rx = this.x - w / 2;
        const ry = this.y - h;

        // 泡泡底
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#5dade2';
        ctx.lineWidth = 2.5;
        roundRect(ctx, rx, ry, w, h, 12);
        ctx.fill();
        ctx.stroke();

        // 小三角
        ctx.beginPath();
        ctx.moveTo(this.x - 6, ry + h);
        ctx.lineTo(this.x, ry + h + 8);
        ctx.lineTo(this.x + 6, ry + h);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#1a5276';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.text, this.x, ry + h / 2);
        ctx.restore();
      }
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ---------- 主模擬類別 ----------
    class WindSimulation {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.dpr = Math.max(1, window.devicePixelRatio || 1);

        this.heat = 0.7;          // 0~1 太陽熱度
        this.heatingOn = true;    // 日間加熱開關
        this.mode = 'particles';  // 'particles' | 'arrows'
        this.speedBoost = 1;      // 答對後加速
        this.boostTimer = 0;

        this.particles = [];
        this.bubbles = [];
        this.time = 0;
        this.lastTs = 0;
        this.running = false;

        this.cssW = 940;
        this.cssH = 520;
        this.layout = this.computeLayout();

        this.resize();
        this.spawnParticles();
        this.bindEvents();
      }

      computeLayout() {
        const w = this.cssW;
        const h = this.cssH;
        return {
          w, h,
          horizon: h * 0.62,
          groundY: h * 0.58,
          skyY: h * 0.18,
          landCenterX: w * 0.28,
          seaCenterX: w * 0.72,
          shoreX: w * 0.52,
          sunX: w * 0.18,
          sunY: h * 0.16,
        };
      }

      spawnParticles() {
        this.particles = [];
        const count = 28;
        for (let i = 0; i < count; i++) {
          this.particles.push(new AirParticle(i % 2 === 0 ? 'hot' : 'cold', this.layout));
        }
      }

      bindEvents() {
        this.canvas.addEventListener('pointerdown', (e) => this.onClick(e));
        window.addEventListener('resize', () => this.resize());
      }

      onClick(e) {
        const rect = this.canvas.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * this.cssW;
        const y = ((e.clientY - rect.top) / rect.height) * this.cssH;
        const L = this.layout;

        // 點太陽
        if (Math.hypot(x - L.sunX, y - L.sunY) < 60) {
          this.bubbles.push(new TipBubble(x, y, '太陽：提供熱能！'));
          return;
        }

        // 左側偏陸地、右側偏海洋（以海岸線分隔）
        if (x < L.shoreX) {
          this.bubbles.push(new TipBubble(x, Math.min(y, L.horizon + 20), '陸地：受熱較快 ☀️'));
        } else {
          this.bubbles.push(new TipBubble(x, Math.min(y, L.horizon + 30), '海洋：溫度較低 🌊'));
        }
      }

      setHeat(value01) {
        this.heat = clamp(value01, 0, 1);
      }

      setHeating(on) {
        this.heatingOn = on;
      }

      setMode(mode) {
        this.mode = mode;
      }

      /** 答對題目後加速展示風速 */
      boostWind(seconds = 5) {
        this.speedBoost = 2.4;
        this.boostTimer = seconds;
      }

      resize() {
        const parent = this.canvas.parentElement;
        const maxW = Math.min(940, parent ? parent.clientWidth - 8 : 940);
        const ratio = 520 / 940;
        this.cssW = Math.max(300, maxW);
        this.cssH = Math.round(this.cssW * ratio);
        this.dpr = Math.max(1, window.devicePixelRatio || 1);

        this.canvas.width = Math.round(this.cssW * this.dpr);
        this.canvas.height = Math.round(this.cssH * this.dpr);
        this.canvas.style.width = this.cssW + 'px';
        this.canvas.style.height = this.cssH + 'px';

        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        this.layout = this.computeLayout();
        // 更新粒子佈局參考
        this.particles.forEach((p) => { p.layout = this.layout; });
      }

      start() {
        if (this.running) return;
        this.running = true;
        this.lastTs = performance.now();
        const loop = (ts) => {
          if (!this.running) return;
          const dt = clamp((ts - this.lastTs) / 1000, 0, 0.05);
          this.lastTs = ts;
          this.update(dt);
          this.draw();
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }

      update(dt) {
        this.time += dt;

        if (this.boostTimer > 0) {
          this.boostTimer -= dt;
          if (this.boostTimer <= 0) {
            this.boostTimer = 0;
            this.speedBoost = 1;
          }
        }

        const effectiveHeat = this.heatingOn ? this.heat : this.heat * 0.08;
        const boost = this.speedBoost;

        if (this.mode === 'particles') {
          for (const p of this.particles) {
            p.update(dt, effectiveHeat, boost);
          }
        }

        this.bubbles = this.bubbles.filter((b) => {
          b.update(dt);
          return b.alive;
        });
      }

      draw() {
        const ctx = this.ctx;
        const L = this.layout;
        const w = L.w;
        const h = L.h;

        ctx.clearRect(0, 0, w, h);

        this.drawSky(ctx, L);
        this.drawSun(ctx, L);
        this.drawLand(ctx, L);
        this.drawSea(ctx, L);
        this.drawLighthouse(ctx, L);
        this.drawTrees(ctx, L);

        // 氣流層
        if (this.mode === 'particles') {
          for (const p of this.particles) p.draw(ctx);
        } else {
          this.drawArrows(ctx, L);
        }

        this.drawLabels(ctx, L);

        for (const b of this.bubbles) b.draw(ctx);
      }

      drawSky(ctx, L) {
        const heat = this.heatingOn ? this.heat : 0.15;
        const top = mixColor('#5dade2', '#7ec8f5', heat);
        const bot = mixColor('#aed6f1', '#d6eaf8', heat);
        const g = ctx.createLinearGradient(0, 0, 0, L.h);
        g.addColorStop(0, top);
        g.addColorStop(0.55, bot);
        g.addColorStop(1, '#b3e0ff');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, L.w, L.h);

        // 柔和雲朵
        ctx.save();
        ctx.globalAlpha = 0.45;
        this.drawCloud(ctx, L.w * 0.55, L.h * 0.12, 1.1);
        this.drawCloud(ctx, L.w * 0.82, L.h * 0.2, 0.8);
        ctx.restore();
      }

      drawCloud(ctx, x, y, s) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
        ctx.arc(x + 22 * s, y - 6 * s, 22 * s, 0, Math.PI * 2);
        ctx.arc(x + 46 * s, y + 2 * s, 16 * s, 0, Math.PI * 2);
        ctx.arc(x + 20 * s, y + 8 * s, 14 * s, 0, Math.PI * 2);
        ctx.fill();
      }

      drawSun(ctx, L) {
        const heat = this.heatingOn ? this.heat : 0.2;
        const pulse = 1 + Math.sin(this.time * (1.5 + heat * 2)) * 0.06 * heat;
        const r = (28 + heat * 14) * pulse;

        // 光芒
        ctx.save();
        ctx.translate(L.sunX, L.sunY);
        const rays = 12;
        for (let i = 0; i < rays; i++) {
          const ang = (i / rays) * Math.PI * 2 + this.time * 0.4;
          const len = (40 + heat * 35) * pulse;
          ctx.strokeStyle = `rgba(255, 193, 7, ${0.25 + heat * 0.45})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(Math.cos(ang) * (r + 4), Math.sin(ang) * (r + 4));
          ctx.lineTo(Math.cos(ang) * len, Math.sin(ang) * len);
          ctx.stroke();
        }

        const glow = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.2);
        glow.addColorStop(0, `rgba(255, 236, 150, ${0.55 + heat * 0.35})`);
        glow.addColorStop(1, 'rgba(255, 193, 7, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2);
        ctx.fill();

        const core = ctx.createRadialGradient(-r * 0.25, -r * 0.25, 0, 0, 0, r);
        core.addColorStop(0, '#fff59d');
        core.addColorStop(0.55, '#ffca28');
        core.addColorStop(1, '#ff9800');
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawLand(ctx, L) {
        const shore = L.shoreX;
        const horizon = L.horizon;

        // 綠色山丘
        ctx.fillStyle = '#6fcf6f';
        ctx.beginPath();
        ctx.moveTo(0, L.h);
        ctx.lineTo(0, horizon + 20);
        ctx.quadraticCurveTo(L.w * 0.12, horizon - 70, L.w * 0.26, horizon - 10);
        ctx.quadraticCurveTo(L.w * 0.38, horizon + 35, shore, horizon + 8);
        ctx.lineTo(shore, L.h);
        ctx.closePath();
        ctx.fill();

        // 山丘陰影層
        ctx.fillStyle = '#4caf50';
        ctx.beginPath();
        ctx.moveTo(0, L.h);
        ctx.lineTo(0, horizon + 55);
        ctx.quadraticCurveTo(L.w * 0.18, horizon + 10, L.w * 0.32, horizon + 40);
        ctx.quadraticCurveTo(L.w * 0.42, horizon + 60, shore - 10, horizon + 35);
        ctx.lineTo(shore, L.h);
        ctx.closePath();
        ctx.fill();

        // 沙灘交接
        ctx.fillStyle = '#f6d7a7';
        ctx.beginPath();
        ctx.moveTo(shore - 28, horizon + 5);
        ctx.quadraticCurveTo(shore - 5, horizon + 18, shore + 8, horizon + 12);
        ctx.lineTo(shore + 8, L.h);
        ctx.lineTo(shore - 28, L.h);
        ctx.closePath();
        ctx.fill();
      }

      drawSea(ctx, L) {
        const shore = L.shoreX;
        const horizon = L.horizon;
        const t = this.time;

        const seaGrad = ctx.createLinearGradient(0, horizon, 0, L.h);
        seaGrad.addColorStop(0, '#5dade2');
        seaGrad.addColorStop(0.45, '#2980b9');
        seaGrad.addColorStop(1, '#1a5276');
        ctx.fillStyle = seaGrad;
        ctx.beginPath();
        ctx.moveTo(shore - 4, horizon + 10);
        ctx.lineTo(L.w, horizon + 10);
        ctx.lineTo(L.w, L.h);
        ctx.lineTo(shore - 4, L.h);
        ctx.closePath();
        ctx.fill();

        // 動態波浪
        for (let layer = 0; layer < 3; layer++) {
          const yBase = horizon + 28 + layer * 28;
          const amp = 6 + layer * 2;
          const speed = 1.2 + layer * 0.35;
          ctx.beginPath();
          ctx.moveTo(shore - 4, L.h);
          ctx.lineTo(shore - 4, yBase);
          for (let x = shore - 4; x <= L.w + 4; x += 8) {
            const y = yBase + Math.sin(x * 0.03 + t * speed + layer) * amp;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(L.w, L.h);
          ctx.closePath();
          ctx.fillStyle = layer === 0
            ? 'rgba(174, 214, 241, 0.35)'
            : layer === 1
              ? 'rgba(133, 193, 233, 0.28)'
              : 'rgba(46, 134, 193, 0.22)';
          ctx.fill();
        }

        // 粼粼反光
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.strokeStyle = '#d4efdf';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 8; i++) {
          const x = shore + 40 + i * ((L.w - shore) / 8);
          const y = horizon + 40 + (i % 3) * 22 + Math.sin(t * 2 + i) * 4;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + 14, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      drawLighthouse(ctx, L) {
        const x = L.w * 0.78;
        const baseY = L.horizon + 18;
        const h = 78;

        // 岩礁
        ctx.fillStyle = '#7f8c8d';
        ctx.beginPath();
        ctx.ellipse(x, baseY + 8, 28, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // 塔身條紋
        const bw = 16;
        ctx.fillStyle = '#ecf0f1';
        ctx.fillRect(x - bw / 2, baseY - h, bw, h);
        ctx.fillStyle = '#e74c3c';
        for (let i = 0; i < 4; i++) {
          ctx.fillRect(x - bw / 2, baseY - h + 8 + i * 18, bw, 8);
        }

        // 燈室
        ctx.fillStyle = '#f5b041';
        ctx.fillRect(x - 12, baseY - h - 16, 24, 18);
        ctx.fillStyle = '#f9e79f';
        ctx.globalAlpha = 0.55 + Math.sin(this.time * 3) * 0.25;
        ctx.beginPath();
        ctx.arc(x, baseY - h - 8, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // 屋頂
        ctx.fillStyle = '#922b21';
        ctx.beginPath();
        ctx.moveTo(x - 14, baseY - h - 16);
        ctx.lineTo(x, baseY - h - 30);
        ctx.lineTo(x + 14, baseY - h - 16);
        ctx.closePath();
        ctx.fill();
      }

      drawTrees(ctx, L) {
        const trees = [
          { x: L.w * 0.1, y: L.horizon + 8, s: 1 },
          { x: L.w * 0.2, y: L.horizon - 5, s: 1.15 },
          { x: L.w * 0.34, y: L.horizon + 12, s: 0.9 },
          { x: L.w * 0.42, y: L.horizon + 18, s: 0.75 },
        ];
        for (const t of trees) this.drawTree(ctx, t.x, t.y, t.s);
      }

      drawTree(ctx, x, y, s) {
        ctx.fillStyle = '#6d4c41';
        ctx.fillRect(x - 3 * s, y - 18 * s, 6 * s, 20 * s);
        ctx.fillStyle = '#2ecc71';
        ctx.beginPath();
        ctx.arc(x, y - 28 * s, 14 * s, 0, Math.PI * 2);
        ctx.arc(x - 10 * s, y - 20 * s, 11 * s, 0, Math.PI * 2);
        ctx.arc(x + 10 * s, y - 20 * s, 11 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.arc(x, y - 32 * s, 9 * s, 0, Math.PI * 2);
        ctx.fill();
      }

      drawArrows(ctx, L) {
        const heat = this.heatingOn ? this.heat : 0.1;
        const boost = this.speedBoost;
        const phase = this.time * (0.9 + heat * 1.8) * boost;

        // 熱空氣上升（紅）
        this.drawFlowArrow(
          ctx,
          [
            { x: L.landCenterX - 10, y: L.groundY - 5 },
            { x: L.landCenterX - 5, y: L.skyY + 40 },
            { x: L.landCenterX + 5, y: L.skyY + 5 },
          ],
          '#e74c3c',
          phase,
          '熱空氣上升'
        );

        // 高空往海（淡紅）
        this.drawFlowArrow(
          ctx,
          [
            { x: L.landCenterX + 20, y: L.skyY },
            { x: (L.landCenterX + L.seaCenterX) / 2, y: L.skyY - 8 },
            { x: L.seaCenterX - 10, y: L.skyY + 8 },
          ],
          '#e67e22',
          phase + 0.4,
          ''
        );

        // 冷空氣下沉（藍）
        this.drawFlowArrow(
          ctx,
          [
            { x: L.seaCenterX + 8, y: L.skyY + 30 },
            { x: L.seaCenterX + 5, y: (L.skyY + L.groundY) / 2 },
            { x: L.seaCenterX, y: L.groundY - 8 },
          ],
          '#2980b9',
          phase + 0.7,
          '冷空氣下沉'
        );

        // 海風吹向陸地（藍）
        this.drawFlowArrow(
          ctx,
          [
            { x: L.seaCenterX - 20, y: L.groundY - 4 },
            { x: (L.landCenterX + L.seaCenterX) / 2, y: L.groundY + 2 },
            { x: L.landCenterX + 25, y: L.groundY - 6 },
          ],
          '#3498db',
          phase + 1.1,
          '冷空氣流向陸地（海風）'
        );
      }

      drawFlowArrow(ctx, points, color, phase, label) {
        if (points.length < 2) return;

        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalAlpha = 0.85;

        // 曲線路徑
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
          const xc = (points[i].x + points[i + 1].x) / 2;
          const yc = (points[i].y + points[i + 1].y) / 2;
          ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
        }
        const last = points[points.length - 1];
        const prev = points[points.length - 2];
        ctx.quadraticCurveTo(prev.x, prev.y, last.x, last.y);
        ctx.stroke();

        // 動態虛線光點沿箭頭移動
        const dashCount = 4;
        for (let i = 0; i < dashCount; i++) {
          const t = ((phase * 0.25 + i / dashCount) % 1);
          const pos = samplePolyline(points, t);
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, 4.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // 箭頭頭部
        const tip = points[points.length - 1];
        const before = points[points.length - 2];
        const ang = Math.atan2(tip.y - before.y, tip.x - before.x);
        ctx.beginPath();
        ctx.moveTo(tip.x, tip.y);
        ctx.lineTo(tip.x - 16 * Math.cos(ang - 0.4), tip.y - 16 * Math.sin(ang - 0.4));
        ctx.lineTo(tip.x - 16 * Math.cos(ang + 0.4), tip.y - 16 * Math.sin(ang + 0.4));
        ctx.closePath();
        ctx.fill();

        if (label) {
          ctx.globalAlpha = 1;
          ctx.font = 'bold 13px "Noto Sans TC", sans-serif';
          ctx.textAlign = 'center';
          const mid = samplePolyline(points, 0.45);
          const pad = 6;
          const tw = ctx.measureText(label).width;
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          roundRect(ctx, mid.x - tw / 2 - pad, mid.y - 22, tw + pad * 2, 22, 8);
          ctx.fill();
          ctx.fillStyle = color;
          ctx.fillText(label, mid.x, mid.y - 8);
        }
        ctx.restore();
      }

      drawLabels(ctx, L) {
        ctx.save();
        ctx.font = 'bold 16px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';

        // 陸地標籤
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        roundRect(ctx, L.landCenterX - 36, L.horizon + 48, 72, 26, 10);
        ctx.fill();
        ctx.fillStyle = '#1e8449';
        ctx.fillText('陸地', L.landCenterX, L.horizon + 66);

        // 海洋標籤
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        roundRect(ctx, L.seaCenterX - 36, L.horizon + 55, 72, 26, 10);
        ctx.fill();
        ctx.fillStyle = '#1a5276';
        ctx.fillText('海洋', L.seaCenterX, L.horizon + 73);

        // 中央說明（僅粒子模式時顯示簡短提示）
        if (this.mode === 'particles' && this.heatingOn && this.heat > 0.2) {
          ctx.font = 'bold 14px "Noto Sans TC", sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          const msg = this.speedBoost > 1.2 ? '風速加快中！💨' : '對流循環進行中…';
          const tw = ctx.measureText(msg).width;
          roundRect(ctx, L.w / 2 - tw / 2 - 10, 12, tw + 20, 28, 12);
          ctx.fill();
          ctx.fillStyle = '#c0392b';
          ctx.fillText(msg, L.w / 2, 31);
        }
        ctx.restore();
      }
    }

    /** 沿折線取樣位置 */
    function samplePolyline(points, t) {
      t = clamp(t, 0, 1);
      let total = 0;
      const segs = [];
      for (let i = 0; i < points.length - 1; i++) {
        const d = Math.hypot(points[i + 1].x - points[i].x, points[i + 1].y - points[i].y);
        segs.push(d);
        total += d;
      }
      let dist = t * total;
      for (let i = 0; i < segs.length; i++) {
        if (dist <= segs[i] || i === segs.length - 1) {
          const p = segs[i] === 0 ? 0 : dist / segs[i];
          return {
            x: lerp(points[i].x, points[i + 1].x, clamp(p, 0, 1)),
            y: lerp(points[i].y, points[i + 1].y, clamp(p, 0, 1)),
          };
        }
        dist -= segs[i];
      }
      return points[points.length - 1];
    }

    function mixColor(a, b, t) {
      const pa = hexToRgb(a);
      const pb = hexToRgb(b);
      const r = Math.round(lerp(pa.r, pb.r, t));
      const g = Math.round(lerp(pa.g, pb.g, t));
      const bl = Math.round(lerp(pa.b, pb.b, t));
      return `rgb(${r},${g},${bl})`;
    }

    function hexToRgb(hex) {
      const h = hex.replace('#', '');
      return {
        r: parseInt(h.slice(0, 2), 16),
        g: parseInt(h.slice(2, 4), 16),
        b: parseInt(h.slice(4, 6), 16),
      };
    }

    // ---------- 問答遊戲 ----------
    class QuizGame {
      constructor(sim) {
        this.sim = sim;
        this.answers = { q1: '膨脹', q2: '上升', q3: '上升' };
        this.selected = { q1: '', q2: '', q3: '' };
        this.solved = false;

        this.feedback = document.getElementById('quiz-feedback');
        this.checkBtn = document.getElementById('check-answer');
        this.resetBtn = document.getElementById('reset-quiz');

        // 綁定每個空格的按鈕選擇
        document.querySelectorAll('.quiz-blank').forEach((group) => {
          const key = group.dataset.q;
          group.querySelectorAll('.opt-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
              group.querySelectorAll('.opt-btn').forEach((b) => {
                b.classList.remove('selected', 'correct', 'wrong');
              });
              btn.classList.add('selected');
              this.selected[key] = btn.dataset.value;
              this.feedback.textContent = '';
              this.feedback.className = 'mt-3 mb-0 text-base sm:text-lg font-bold min-h-[1.75rem]';
            });
          });
        });

        this.checkBtn.addEventListener('click', () => this.check());
        this.resetBtn.addEventListener('click', () => this.reset());
      }

      check() {
        const { q1: v1, q2: v2, q3: v3 } = this.selected;

        document.querySelectorAll('.opt-btn').forEach((el) => {
          el.classList.remove('correct', 'wrong');
        });

        if (!v1 || !v2 || !v3) {
          this.feedback.className = 'mt-3 mb-0 text-base sm:text-lg font-bold feedback-hint';
          this.feedback.textContent = '先把三個空格都選好再檢查喔！';
          return;
        }

        const ok1 = v1 === this.answers.q1;
        const ok2 = v2 === this.answers.q2;
        const ok3 = v3 === this.answers.q3;

        this.markGroup('q1', ok1);
        this.markGroup('q2', ok2);
        this.markGroup('q3', ok3);

        if (ok1 && ok2 && ok3) {
          this.solved = true;
          this.feedback.className = 'mt-3 mb-0 text-base sm:text-lg font-bold feedback-ok';
          this.feedback.textContent = '太棒了！答對了 🎉 陸地上熱空氣膨脹上升，冷空氣補充上升的空氣，就形成海風！';
          this.sim.boostWind(6);
          launchConfetti();
          // 短暫切到箭頭模式加強課本示意感
          const particleBtn = document.getElementById('mode-particles');
          const arrowBtn = document.getElementById('mode-arrows');
          this.sim.setMode('arrows');
          arrowBtn.classList.add('active');
          particleBtn.classList.remove('active');
          setTimeout(() => {
            this.sim.setMode('particles');
            particleBtn.classList.add('active');
            arrowBtn.classList.remove('active');
          }, 3500);
        } else {
          this.feedback.className = 'mt-3 mb-0 text-base sm:text-lg font-bold feedback-hint';
          let hint = '再想想看～';
          if (!ok1) hint = '想想看，熱空氣會變輕還是變重呢？受熱後空氣會膨脹喔！';
          else if (!ok2) hint = '膨脹變輕的熱空氣，會上升還是下沉呢？';
          else if (!ok3) hint = '海洋冷空氣吹來，是要補充「上升」還是「下沉」的空氣呢？';
          this.feedback.textContent = hint;
        }
      }

      markGroup(key, ok) {
        const group = document.querySelector(`.quiz-blank[data-q="${key}"]`);
        const selected = group.querySelector('.opt-btn.selected');
        if (selected) selected.classList.add(ok ? 'correct' : 'wrong');
      }

      reset() {
        this.solved = false;
        this.selected = { q1: '', q2: '', q3: '' };
        document.querySelectorAll('.opt-btn').forEach((el) => {
          el.classList.remove('selected', 'correct', 'wrong');
        });
        this.feedback.className = 'mt-3 mb-0 text-base sm:text-lg font-bold min-h-[1.75rem]';
        this.feedback.textContent = '';
        this.sim.speedBoost = 1;
        this.sim.boostTimer = 0;
      }
    }

    // ---------- 彩帶慶祝 ----------
    function launchConfetti() {
      const layer = document.getElementById('confetti-layer');
      const colors = ['#e74c3c', '#f39c12', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#e91e63'];
      const count = 60;
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.background = colors[i % colors.length];
        piece.style.animationDuration = rand(1.6, 3.2) + 's';
        piece.style.animationDelay = rand(0, 0.5) + 's';
        piece.style.transform = `rotate(${rand(0, 360)}deg)`;
        piece.style.width = rand(8, 12) + 'px';
        piece.style.height = rand(10, 16) + 'px';
        layer.appendChild(piece);
        setTimeout(() => piece.remove(), 4000);
      }
    }

    // ---------- 控制面板綁定 ----------
    function setupControls(sim) {
      const slider = document.getElementById('heat-slider');
      const heatLabel = document.getElementById('heat-label');
      const btnDay = document.getElementById('btn-day');
      const btnNight = document.getElementById('btn-night');
      const modeParticles = document.getElementById('mode-particles');
      const modeArrows = document.getElementById('mode-arrows');
      const hint = document.getElementById('canvas-hint');

      const updateHeatLabel = () => {
        const v = Number(slider.value);
        if (!sim.heatingOn) {
          heatLabel.textContent = '加熱已暫停';
          return;
        }
        if (v < 25) heatLabel.textContent = '清晨微暖';
        else if (v < 55) heatLabel.textContent = '上午暖熱';
        else if (v < 80) heatLabel.textContent = '日間加熱';
        else heatLabel.textContent = '正午強熱！';
      };

      slider.addEventListener('input', () => {
        const v = Number(slider.value) / 100;
        sim.setHeat(v);
        slider.setAttribute('aria-valuenow', String(slider.value));
        if (!sim.heatingOn) {
          sim.setHeating(true);
          btnDay.classList.add('active');
          btnNight.classList.remove('active');
        }
        updateHeatLabel();
        hint.textContent = v > 0.5
          ? '熱力夠強！看紅粒子膨脹上升，藍粒子從海上吹來～'
          : '熱力較弱時，空氣流動會變慢。';
      });

      btnDay.addEventListener('click', () => {
        sim.setHeating(true);
        btnDay.classList.add('active');
        btnNight.classList.remove('active');
        updateHeatLabel();
        hint.textContent = '日間加熱開啟：陸地升溫，海風開始加強！';
      });

      btnNight.addEventListener('click', () => {
        sim.setHeating(false);
        btnNight.classList.add('active');
        btnDay.classList.remove('active');
        updateHeatLabel();
        hint.textContent = '加熱暫停：對流變慢，觀察看看有什麼不同？';
      });

      modeParticles.addEventListener('click', () => {
        sim.setMode('particles');
        modeParticles.classList.add('active');
        modeArrows.classList.remove('active');
        hint.textContent = '氣流粒子模式：紅＝熱空氣，藍＝冷空氣（海風）。';
      });

      modeArrows.addEventListener('click', () => {
        sim.setMode('arrows');
        modeArrows.classList.add('active');
        modeParticles.classList.remove('active');
        hint.textContent = '示意箭頭模式：像課本圖一樣的紅／藍對流箭頭。';
      });

      updateHeatLabel();
    }

    // ---------- 啟動 ----------
    function boot() {
      const canvas = document.getElementById('sim-canvas');
      const sim = new WindSimulation(canvas);
      setupControls(sim);
      new QuizGame(sim);
      sim.start();
      // 暴露給除錯／測試使用
      window.__seaBreezeSim = sim;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
